spring.application.name=KaamSetuBackend

# Server Configuration
server.port=${PORT:8085}

# Database Configuration (MySQL / Cloud Database)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kaamsetu_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Ritesh@07}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:KaamSetuSuperSecureKeyWithHighEntropyForHmacSha256AlgorithmMustBeAtLeast256BitsLong!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (Comma-separated, supports production host domains)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5174,http://localhost:8085,https://kaamsetu.vercel.app,https://kaamsetu.netlify.app}

# Logging Configuration
logging.level.com.kaamsetu=INFO
logging.level.org.springframework.security=WARN
